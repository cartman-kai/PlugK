name: Build and Release

on:
  push:
    tags:
      - "v*" # 当你推送以 v 开头的标签（如 v0.0.0.1）时触发
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: msbuild plugK.sln /p:Configuration=Release /p:Platform=x86 # 根据你的实际平台修改 x64 或 x86

      - name: Prepare Package Folders
        shell: pwsh
        run: |
          # 创建临时打包目录
          New-Item -ItemType Directory -Force -Path "release_zip"

          # 拷贝编译产物 (请根据你项目的实际生成路径检查这些路径)
          # 这里的路径假设你的输出目录配置为 $(SolutionDir)bin\$(Configuration)\
          Copy-Item "bin/Win32/Release/plugK.dll" -Destination "release_zip/"
          Copy-Item "bin/Win32/Release/plugKLoader.exe" -Destination "release_zip/"

          # 如果根目录下有 ini 文件也一并考入
          if (Test-Path "plugK/plugK.ini") {
            Copy-Item "plugK/plugK.ini" -Destination "release_zip/"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # 这里的名字是你在 Actions 页面看到的下载项名称
          name: plugK_v${{ github.ref_name }}_build # 下载后的文件名
          path: plugK_Release/ # 直接上传整个文件夹
          retention-days: 5 # 产物保留 5 天，节省你的 GitHub 存储空间
