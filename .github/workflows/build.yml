name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    name: Build Check
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: msbuild plugK.sln /p:Configuration=Release /p:Platform=x86

  release:
    name: Build Release Package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: msbuild plugK.sln /p:Configuration=Release /p:Platform=x86

      - name: Prepare Package Folders
        shell: pwsh
        run: |
          $releaseNotes = "docs/release_note/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $releaseNotes)) {
            Write-Error "Missing release notes: $releaseNotes"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "release_zip" | Out-Null

          Copy-Item "bin/Win32/Release/plugK.dll" -Destination "release_zip/"
          Copy-Item "bin/Win32/Release/plugKLauncher.exe" -Destination "release_zip/"
          Copy-Item "README.md" -Destination "release_zip/"
          Copy-Item "LICENSE" -Destination "release_zip/"
          Copy-Item "THIRD_PARTY_NOTICES.md" -Destination "release_zip/"
          Copy-Item $releaseNotes -Destination "release_zip/更新说明.md"

      - name: Create Zip Archive
        shell: pwsh
        run: Compress-Archive -Path "release_zip/*" -DestinationPath "plugK_${{ github.ref_name }}_build.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugK-Binary-Package
          path: "*.zip"
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: "docs/release_note/${{ github.ref_name }}.md"
          files: "plugK_${{ github.ref_name }}_build.zip"
