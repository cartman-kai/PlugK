name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    name: Build Check
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: msbuild plugK.sln /p:Configuration=Release /p:Platform=x86

  release:
    name: Build Release Package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: msbuild plugK.sln /p:Configuration=Release /p:Platform=x86

      - name: Prepare Release Metadata
        shell: pwsh
        run: |
          $versionHeader = "version_info.h"
          $versionValues = @{}
          foreach ($line in Get-Content -LiteralPath $versionHeader) {
            if ($line -match '^\s*#define\s+(VERSION_MAJOR|VERSION_MINOR|VERSION_REVISION|VERSION_BUILD)\s+(\d+)\s*$') {
              $versionValues[$matches[1]] = [int]$matches[2]
            }
          }

          $requiredKeys = @("VERSION_MAJOR", "VERSION_MINOR", "VERSION_REVISION", "VERSION_BUILD")
          foreach ($key in $requiredKeys) {
            if (-not $versionValues.ContainsKey($key)) {
              Write-Error "Missing version macro: $key"
              exit 1
            }
          }

          $packageVersion = "{0}.{1}.{2}.{3}" -f $versionValues["VERSION_MAJOR"], $versionValues["VERSION_MINOR"], $versionValues["VERSION_REVISION"], $versionValues["VERSION_BUILD"]
          "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

          $tagName = "${{ github.ref_name }}"
          $changelog = "CHANGELOG.md"
          if (-not (Test-Path -LiteralPath $changelog)) {
            Write-Error "Missing changelog: $changelog"
            exit 1
          }

          $lines = Get-Content -LiteralPath $changelog
          $headingPattern = '^(#{1,6})\s+' + [regex]::Escape($tagName) + '\s*$'
          $startIndex = -1
          $headingLevel = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $headingPattern) {
              $startIndex = $i
              $headingLevel = $matches[1].Length
              break
            }
          }

          if ($startIndex -lt 0) {
            Write-Error "Missing changelog section for tag: $tagName"
            exit 1
          }

          $endIndex = $lines.Count
          for ($i = $startIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^(#{1,' + $headingLevel + '})\s+') {
              $endIndex = $i
              break
            }
          }

          $releaseNoteLines = @($lines[$startIndex..($endIndex - 1)])
          $releaseNoteLines | Set-Content -LiteralPath "release_notes.md" -Encoding UTF8

      - name: Prepare Package Folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_zip" | Out-Null

          Copy-Item "bin/Win32/Release/plugK.dll" -Destination "release_zip/"
          Copy-Item "bin/Win32/Release/plugKLauncher.exe" -Destination "release_zip/"
          Copy-Item "README.md" -Destination "release_zip/"
          Copy-Item "LICENSE" -Destination "release_zip/"
          Copy-Item "THIRD_PARTY_NOTICES.md" -Destination "release_zip/"
          Copy-Item "release_notes.md" -Destination "release_zip/更新说明.md"

      - name: Create Zip Archive
        shell: pwsh
        run: Compress-Archive -Path "release_zip/*" -DestinationPath "plugK_${{ env.PACKAGE_VERSION }}_build.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugK-Binary-Package
          path: "*.zip"
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: "release_notes.md"
          files: "plugK_${{ env.PACKAGE_VERSION }}_build.zip"
